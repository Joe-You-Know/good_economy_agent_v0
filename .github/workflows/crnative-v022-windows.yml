name: Constructive Runtime Native v0.22 Windows validation
on:
  push:
    branches:
      - experiments/constructive-runtime-native-v022
    paths:
      - experiments/constructive_runtime_native/v022_source.b64
      - .github/workflows/crnative-v022-windows.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows MSVC x64 - native v0.22 three-suite tests
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and pin source
        shell: pwsh
        run: |
          $in = (Get-Content -Raw 'experiments/constructive_runtime_native/v022_source.b64').Trim()
          $zip = Join-Path $env:RUNNER_TEMP 'crnative-v022.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($in))
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '89b1f15c0c42127e2c8cd10a88244f0a2330f78429512e9fd03d47d4ea1762a4') { throw "archive checksum mismatch $sha" }
          $unpack=Join-Path $env:RUNNER_TEMP 'native-source'
          Expand-Archive $zip -DestinationPath $unpack -Force
          $src=Join-Path $unpack 'constructive_runtime_native_v0_22'
          if (!(Test-Path (Join-Path $src 'CMakeLists.txt'))) { throw 'source root missing' }
          "CR_NATIVE_SOURCE=$src" >> $env:GITHUB_ENV
          "CR_NATIVE_BUILD=$(Join-Path $env:RUNNER_TEMP 'crnative-build')" >> $env:GITHUB_ENV
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg $root
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          "CR_VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure MSVC C++20 with static native dependencies
        shell: pwsh
        run: |
          cmake -S "$env:CR_NATIVE_SOURCE" -B "$env:CR_NATIVE_BUILD" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:CR_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'configuration failed' }
      - name: Compile native engine
        shell: pwsh
        run: |
          cmake --build "$env:CR_NATIVE_BUILD" --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'MSVC build failed' }
      - name: Run all CTest suites
        shell: pwsh
        run: |
          ctest --test-dir "$env:CR_NATIVE_BUILD" -C Release --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Windows native tests failed' }
      - name: Upload diagnostic test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v022-windows-ctest-logs
          if-no-files-found: ignore
          path: ${{ runner.temp }}/crnative-build/Testing/Temporary/**
  linux:
    name: Linux GCC x64 - native v0.22 parity
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore checked source
        run: |
          base64 -d experiments/constructive_runtime_native/v022_source.b64 > /tmp/crnative-v022.zip
          echo '89b1f15c0c42127e2c8cd10a88244f0a2330f78429512e9fd03d47d4ea1762a4  /tmp/crnative-v022.zip' | sha256sum -c -
          unzip -q /tmp/crnative-v022.zip -d /tmp/native
      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev pkg-config
      - name: Build and run parity tests
        run: |
          cmake -S /tmp/native/constructive_runtime_native_v0_22 -B /tmp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/build --parallel 4
          ctest --test-dir /tmp/build --output-on-failure --timeout 180
